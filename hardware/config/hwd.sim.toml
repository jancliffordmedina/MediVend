# SIMULATION backend for development (XAMPP/Windows or the Orange Pi).
# No real coins, motors or sensors are used, and health always reports
# "simulated": true, which PHP refuses in real hardware mode.
# Run from the hardware/ directory:
#   py -m medivend_hwd init-token .local/hwd.token
#   py -m medivend_hwd --config config/hwd.sim.toml serve

[service]
backend = "sim"
host = "127.0.0.1"
port = 8765
token_file = ".local/hwd.token"
journal_path = ".local/journal-sim.sqlite3"

[coin]
pulses = { "5" = 500, "10" = 1000, "20" = 2000 }
glitch_ms = 5
pulse_min_ms = 15
pulse_max_ms = 130
train_gap_ms = 300

[beam]
debounce_ms = 2
max_block_ms = 1500
watch_after_return_ms = 1500
settle_ms = 300

[servo]
min_pulse_us = 1000
max_pulse_us = 2000

[safety]
require_output_enable = true

[sim]
pulse_ms = 30
pulse_gap_ms = 60
beam_delay_ms = 150
beam_block_ms = 40
default_beam = "pass"

[[compartments]]
number = 1
channel = 0
rest_angle = 0
dispense_angle = 90
move_ms = 400
hold_ms = 200

[[compartments]]
number = 2
channel = 1
rest_angle = 0
dispense_angle = 90
move_ms = 400
hold_ms = 200

[[compartments]]
number = 3
channel = 2
rest_angle = 0
dispense_angle = 90
move_ms = 400
hold_ms = 200
